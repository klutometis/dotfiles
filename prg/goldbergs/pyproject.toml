[project]
name = "goldberg"
version = "0.1.0"
description = "Goldberg — compose music (ABC) across models, render to WAV, and let Gemini judge by ear. A kallisti for music."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.3.0",
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "pyyaml>=6.0",
]

[project.scripts]
goldberg = "goldberg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldberg"]
